# Two-AMF free5GC testbed (Ch.5 state-continuity study).
# AMF1 (amfId cafe00, TAC 1) <- gNB1 ; AMF2 (amfId cb0100, TAC 2) <- gNB2.
# No SMF/UPF: the UE has no PDU sessions; only mobility-management state is tested.
# NRF OAuth is off so test probes can call AMF SBI APIs directly.
services:
  db:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port 27017
    networks: {privnet: {aliases: [db]}}

  nrf:
    container_name: nrf
    image: free5gc/nrf:v4.3.0
    command: ./nrf -c ./config/nrfcfg.yaml
    volumes: [./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {DB_URI: mongodb://db/free5gc, GIN_MODE: release}
    networks: {privnet: {aliases: [nrf.free5gc.org]}}
    depends_on: [db]

  amf1:
    container_name: amf1
    image: ${AMF_IMAGE:-free5gc/amf:v4.3.0}
    command: ./amf -c ./config/amfcfg.yaml
    volumes: ["./config/${AMF1_CFG:-amf1cfg.yaml}:/free5gc/config/amfcfg.yaml", "../free5gc-compose/cert:/free5gc/cert"]
    environment: {GIN_MODE: release}
    networks: {privnet: {ipv4_address: 10.100.200.16, aliases: [amf1.free5gc.org]}}
    depends_on: [nrf]

  amf2:
    container_name: amf2
    image: ${AMF_IMAGE:-free5gc/amf:v4.3.0}
    command: ./amf -c ./config/amfcfg.yaml
    volumes: ["./config/${AMF2_CFG:-amf2cfg.yaml}:/free5gc/config/amfcfg.yaml", "../free5gc-compose/cert:/free5gc/cert"]
    environment: {GIN_MODE: release}
    networks: {privnet: {ipv4_address: 10.100.200.17, aliases: [amf2.free5gc.org]}}
    depends_on: [nrf]

  smf:
    container_name: smf
    image: free5gc/smf:v4.3.0
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    volumes: [./config/smfcfg.yaml:/free5gc/config/smfcfg.yaml, ../free5gc-compose/config/uerouting.yaml:/free5gc/config/uerouting.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {GIN_MODE: release}
    networks: {privnet: {ipv4_address: 10.100.200.20, aliases: [smf.free5gc.org]}}
    depends_on: [nrf, upf]
    profiles: [pdu]

  upf:
    container_name: upf
    image: free5gc/upf:v4.3.0
    command: ./upf -c ./config/upfcfg.yaml
    volumes: [./config/upfcfg.yaml:/free5gc/config/upfcfg.yaml]
    cap_add: [NET_ADMIN]
    networks: {privnet: {ipv4_address: 10.100.200.21, aliases: [upf.free5gc.org]}}
    profiles: [pdu]

  ausf:
    container_name: ausf
    image: free5gc/ausf:v4.3.0
    command: ./ausf -c ./config/ausfcfg.yaml
    volumes: [./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {GIN_MODE: release}
    networks: {privnet: {aliases: [ausf.free5gc.org]}}
    depends_on: [nrf]

  nssf:
    container_name: nssf
    image: free5gc/nssf:v4.3.0
    command: ./nssf -c ./config/nssfcfg.yaml
    volumes: [./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {GIN_MODE: release}
    networks: {privnet: {aliases: [nssf.free5gc.org]}}
    depends_on: [nrf]

  pcf:
    container_name: pcf
    image: free5gc/pcf:v4.3.0
    command: ./pcf -c ./config/pcfcfg.yaml
    volumes: [./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {GIN_MODE: release}
    networks: {privnet: {aliases: [pcf.free5gc.org]}}
    depends_on: [nrf]

  udm:
    container_name: udm
    image: free5gc/udm:v4.3.0
    command: ./udm -c ./config/udmcfg.yaml
    volumes: [./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {GIN_MODE: release}
    networks: {privnet: {aliases: [udm.free5gc.org]}}
    depends_on: [db, nrf]

  udr:
    container_name: udr
    image: free5gc/udr:v4.3.0
    command: ./udr -c ./config/udrcfg.yaml
    volumes: [./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml, ../free5gc-compose/cert:/free5gc/cert]
    environment: {DB_URI: mongodb://db/free5gc, GIN_MODE: release}
    networks: {privnet: {aliases: [udr.free5gc.org]}}
    depends_on: [db, nrf]

  webui:
    container_name: webui
    image: free5gc/webui:v4.3.0
    command: ./webui -c ./config/webuicfg.yaml
    volumes: [./config/webuicfg.yaml:/free5gc/config/webuicfg.yaml]
    environment: [GIN_MODE=release]
    ports: ["127.0.0.1:5000:5000"]
    networks: {privnet: {aliases: [webui]}}
    depends_on: [db, nrf]

  gnb1:
    container_name: gnb1
    image: ${UE_IMAGE:-free5gc/ueransim:latest}
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes: ["./config/${GNB1_CFG:-gnb1cfg.yaml}:/ueransim/config/gnbcfg.yaml"]
    cap_add: [NET_ADMIN]
    networks: {privnet: {ipv4_address: 10.100.200.31, aliases: [gnb1.free5gc.org]}}
    depends_on: [amf1]
    profiles: [ran]

  gnb2:
    container_name: gnb2
    image: ${UE_IMAGE:-free5gc/ueransim:latest}
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes: ["./config/${GNB2_CFG:-gnb2cfg.yaml}:/ueransim/config/gnbcfg.yaml"]
    cap_add: [NET_ADMIN]
    networks: {privnet: {ipv4_address: 10.100.200.32, aliases: [gnb2.free5gc.org]}}
    depends_on: [amf2]
    profiles: [ran]

  ue:
    container_name: ue
    image: ${UE_IMAGE:-free5gc/ueransim:latest}
    command: ./nr-ue -c ./config/uecfg.yaml
    volumes: ["./config/${UE_CFG:-uecfg.yaml}:/ueransim/config/uecfg.yaml"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    networks: {privnet: {aliases: [ue.free5gc.org]}}
    profiles: [ue]

  # probe: curl container on the SBI network (acts as a test NF consumer / notification sink)
  probe:
    container_name: probe
    image: curlimages/curl:latest
    command: sleep infinity
    networks: {privnet: {ipv4_address: 10.100.200.50, aliases: [probe.free5gc.org]}}

networks:
  privnet:
    ipam: {driver: default, config: [{subnet: 10.100.200.0/24}]}
    driver_opts: {com.docker.network.bridge.name: br-twoamf}
